<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Hallucinator</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/login.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <a class="auth-brand" href="/login">
      <img src="/static/logo.svg" alt="">
      <span>Hallucinator</span>
    </a>

    <section class="card auth-card" aria-labelledby="auth-heading">
      <h1 id="auth-heading" class="auth-title">Sign in</h1>

      <div id="notice" class="banner banner-info hidden" role="status" aria-live="polite"></div>
      <div id="lockout" class="lockout hidden" role="alert" aria-live="assertive"></div>

      <form id="form-signin" novalidate>
        <label class="field">
          <span>Username</span>
          <input class="input" id="si-username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input class="input" id="si-password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="si-error" class="field-error hidden" role="alert"></p>
        <button class="btn btn-primary" id="si-submit" type="submit">Sign in</button>
      </form>

      <p class="caption auth-note">Accounts are created by an administrator.</p>
    </section>

    <p class="auth-foot">
      Hallucinator checks every reference in a paper against bibliographic databases.
      Its detections are leads to verify by hand, not proof of fabrication.
    </p>
  </main>
</body>
</html>
